<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paperwork Automation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 400px; font-family: Consolas, monospace; font-size: 0.9rem; box-sizing: border-box; }
    .checkboxes { margin: 1rem 0; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
    .flash { background: #fdecea; color: #611a15; border: 1px solid #f5c6cb; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Paperwork Automation</h1>
  <p>Paste the tenant JSON below, choose which sections to generate, then click Generate to download a .zip of the Word documents.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form action="{{ url_for('generate') }}" method="post">
    <textarea name="input_json" placeholder="Paste your JSON here..." required></textarea>
    <div class="checkboxes">
      <label><input type="checkbox" name="section3" checked> Section 3 (Support Session Notes)</label>
      &nbsp;&nbsp;
      <label><input type="checkbox" name="section4" checked> Section 4 (Support Plan)</label>
    </div>
    <button type="submit">Generate documents</button>
  </form>
</body>
</html>
